# fly.toml app configuration file generated for rocket-carwash-pos on 2026-05-11T06:39:32Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rocket-carwash-pos'
primary_region = 'iad'

[build]
  builder = 'nixpacks'

  [build.args]
    NIXPACKS_PKGS = 'pnpm nodejs'
    PNPM_INSTALL_ARGS = '--no-frozen-lockfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
